<title>스커트 원형 제도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting table — controls column beside a large gridded pattern sheet; stacks on phones */
:root {
  --bg: #eef1f3;
  --sheet: #fbfcfd;
  --grid: #d9e2ea;
  --grid-major: #b7c6d4;
  --ink: #1c2b3a;
  --muted: #5d6e7f;
  --piece: #ffffff;
  --sa: #dbe7f2;
  --dart: #c2412d;
  --accent: #2e5f8a;
  --line: #cbd5de;
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121820; --sheet: #18212b; --grid: #223040; --grid-major: #31455a; --ink: #e3ebf2; --muted: #93a5b6;
  --piece: #1f2b38; --sa: #2a3d52; --dart: #ef7a63; --accent: #7fb2de; --line: #2c3a48; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121820; --sheet: #18212b; --grid: #223040; --grid-major: #31455a; --ink: #e3ebf2; --muted: #93a5b6;
  --piece: #1f2b38; --sa: #2a3d52; --dart: #ef7a63; --accent: #7fb2de; --line: #2c3a48; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
h1 { font-family: var(--display); font-size: 1.9rem; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.field label { font-size: 0.92rem; }
.field output { font-family: var(--mono); font-size: 0.88rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
td:last-child { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; min-width: 0; }
.sheet svg { display: block; width: 100%; height: auto; min-width: 520px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--muted); padding: 10px 14px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.note { font-size: 0.8rem; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>스커트 원형 제도</h1>
    <p class="sub">치수를 바꾸면 앞판·뒤판 패턴이 1cm 격자 위에 바로 다시 그려져요. 반쪽 패턴이라 중심선(CF·CB)은 골선으로 접어서 재단합니다.</p>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2>치수 (cm)</h2>
      <div class="field"><label for="waist">허리둘레</label><output id="o-waist"></output><input type="range" id="waist" min="56" max="110" step="1" value="68"></div>
      <div class="field"><label for="hip">엉덩이둘레</label><output id="o-hip"></output><input type="range" id="hip" min="80" max="130" step="1" value="94"></div>
      <div class="field"><label for="hipDepth">엉덩이길이</label><output id="o-hipDepth"></output><input type="range" id="hipDepth" min="15" max="24" step="0.5" value="19"></div>
      <div class="field"><label for="length">스커트 길이</label><output id="o-length"></output><input type="range" id="length" min="35" max="95" step="1" value="60"></div>
      <h2>디자인</h2>
      <div class="field"><label for="flare">밑단 플레어</label><output id="o-flare"></output><input type="range" id="flare" min="0" max="20" step="0.5" value="4"></div>
      <div class="field"><label for="sa">시접</label><output id="o-sa"></output><input type="range" id="sa" min="0" max="2" step="0.5" value="1"></div>
      <label class="check"><input type="checkbox" id="showGrain" checked> 식서 방향 표시</label>
      <h2>계산값</h2>
      <table id="calc"></table>
      <p class="note">예시 치수는 여성 표준 M 사이즈 기준이에요.</p>
    </aside>

    <section class="sheet">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스커트 앞판과 뒤판 패턴"></svg>
      <div class="legend">
        <span><i class="sw" style="background:var(--piece);border:1.5px solid var(--ink)"></i>완성선</span>
        <span><i class="sw" style="background:var(--sa)"></i>시접</span>
        <span><i class="sw" style="background:var(--dart)"></i>다트</span>
        <span>격자 1칸 = 1cm</span>
      </div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const ids = ["waist","hip","hipDepth","length","flare","sa"];
const f = n => (Math.round(n * 10) / 10).toFixed(1);

function piece(o, isBack) {
  // Half piece, center line on the left at x=0. Units: cm.
  const H = o.hip / 4 + (isBack ? 0 : 0.5) + 0.5;           // hip width with ease
  const W = o.waist / 4 + (isBack ? -0.5 : 0.5) + 0.5;       // waist width with ease
  const excess = H - W;
  const dart = Math.max(0, Math.min(isBack ? excess * 0.6 : excess * 0.45, isBack ? 4 : 3));
  const sideIn = excess - dart;
  const cy = isBack ? 1 : 0;                                  // back waist dips at CB
  const S = { x: H - sideIn, y: -0.7 };                       // side waist, raised
  const hp = { x: H, y: o.hipDepth };
  const hemSide = { x: H + o.flare, y: o.length - o.flare * 0.12 };
  const dartX = (H - sideIn) / 2;
  const dartLen = isBack ? Math.min(13, o.hipDepth - 5) : Math.min(9, o.hipDepth - 8);
  const waistY = x => cy + (S.y - cy) * (x / S.x);
  const path = [
    `M0 ${cy}`,
    `Q${S.x * 0.6} ${cy} ${S.x} ${S.y}`,
    `C${S.x + (H - S.x) * 0.7} ${o.hipDepth * 0.35} ${H} ${o.hipDepth * 0.6} ${hp.x} ${hp.y}`,
    `L${hemSide.x} ${hemSide.y}`,
    `Q${(H + o.flare) * 0.55} ${o.length} 0 ${o.length}`,
    "Z"
  ].join(" ");
  const dy = waistY(dartX) + (isBack ? 0.15 : 0);
  return { H, W, dart, sideIn, path, dartX, dartLen, dy, cy, hemSide, hp, width: H + o.flare };
}

function render() {
  const o = Object.fromEntries(ids.map(k => [k, parseFloat($(k).value)]));
  const unit = { waist: "cm", hip: "cm", hipDepth: "cm", length: "cm", flare: "cm", sa: "cm" };
  ids.forEach(k => $("o-" + k).textContent = f(o[k]) + " " + unit[k]);

  const back = piece(o, true), front = piece(o, false);
  const m = 5, gap = 8;
  const bx = m + o.sa, fx = bx + back.width + o.sa * 2 + gap;
  const vw = fx + front.width + o.sa + m + 2;
  const top = -4 - o.sa, vh = o.length + o.sa + 10 - top;

  const showGrain = $("showGrain").checked;
  const draw = (p, x, label, center) => {
    const dl = p.dart / 2;
    const gx = p.H * 0.45;
    return `<g transform="translate(${x} 0)">
      ${o.sa > 0 ? `<path d="${p.path}" fill="var(--sa)" stroke="var(--sa)" stroke-width="${o.sa * 2}" stroke-linejoin="round"/>` : ""}
      <path d="${p.path}" fill="var(--piece)" stroke="var(--ink)" stroke-width="0.18" stroke-linejoin="round"/>
      <line x1="0" y1="${p.cy}" x2="0" y2="${o.length}" stroke="var(--ink)" stroke-width="0.35" stroke-dasharray="1.2 0.5 0.3 0.5"/>
      <line x1="0" y1="${o.hipDepth}" x2="${p.H}" y2="${o.hipDepth}" stroke="var(--muted)" stroke-width="0.1" stroke-dasharray="0.6 0.4"/>
      <text x="${p.H - 0.5}" y="${o.hipDepth - 0.6}" text-anchor="end" class="sm">HL</text>
      <path d="M${p.dartX - dl} ${p.dy} L${p.dartX} ${p.dy + p.dartLen} L${p.dartX + dl} ${p.dy}" fill="none" stroke="var(--dart)" stroke-width="0.2"/>
      <line x1="${p.dartX}" y1="${p.dy}" x2="${p.dartX}" y2="${p.dy + p.dartLen}" stroke="var(--dart)" stroke-width="0.08" stroke-dasharray="0.4 0.3"/>
      <path d="M${p.hp.x - 0.5} ${o.hipDepth} h1" stroke="var(--ink)" stroke-width="0.2"/>
      ${showGrain ? `<g stroke="var(--accent)" stroke-width="0.15" fill="var(--accent)">
        <line x1="${gx}" y1="${o.hipDepth + 4}" x2="${gx}" y2="${o.length - 6}"/>
        <path d="M${gx} ${o.hipDepth + 3} l-0.6 1.6 h1.2 z M${gx} ${o.length - 5} l-0.6 -1.6 h1.2 z" stroke="none"/></g>` : ""}
      <text x="${gx + 1.2}" y="${(o.hipDepth + o.length) / 2 - 1}" class="lg">${label}</text>
      <text x="${gx + 1.2}" y="${(o.hipDepth + o.length) / 2 + 1.4}" class="sm">2장 · 골선 1장</text>
      <text x="-1.2" y="${o.length / 2}" class="sm" transform="rotate(-90 -1.2 ${o.length / 2})" text-anchor="middle">${center} · 골선</text>
    </g>`;
  };

  $("svg").setAttribute("viewBox", `0 ${top} ${vw} ${vh}`);
  $("svg").innerHTML = `
    <defs>
      <pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="var(--grid)" stroke-width="0.05"/></pattern>
      <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#g1)"/><path d="M5 0H0V5" fill="none" stroke="var(--grid-major)" stroke-width="0.08"/></pattern>
    </defs>
    <style>.sm{font:0.95px var(--mono);fill:var(--muted)}.lg{font:700 1.7px var(--body);fill:var(--ink)}.dim{font:1px var(--mono);fill:var(--accent)}</style>
    <rect x="0" y="${top}" width="${vw}" height="${vh}" fill="var(--sheet)"/>
    <rect x="0" y="${top}" width="${vw}" height="${vh}" fill="url(#g5)"/>
    ${draw(back, bx, "뒤판", "CB")}
    ${draw(front, fx, "앞판", "CF")}
    <g>
      <line x1="${fx}" y1="${o.length + o.sa + 3}" x2="${fx + front.hemSide.x}" y2="${o.length + o.sa + 3}" stroke="var(--accent)" stroke-width="0.1"/>
      <text x="${fx + front.hemSide.x / 2}" y="${o.length + o.sa + 5}" text-anchor="middle" class="dim">밑단 ${f(front.hemSide.x)}</text>
      <line x1="${fx + front.width + o.sa + 2}" y1="0" x2="${fx + front.width + o.sa + 2}" y2="${o.length}" stroke="var(--accent)" stroke-width="0.1"/>
      <text x="${fx + front.width + o.sa + 1.4}" y="${o.length / 2}" class="dim" text-anchor="middle" transform="rotate(-90 ${fx + front.width + o.sa + 1.4} ${o.length / 2})">길이 ${f(o.length)}</text>
    </g>`;

  const rows = [
    ["앞 엉덩이 (H/4+1)", front.H], ["앞 허리 (W/4+1)", front.W], ["앞 다트 분량", front.dart],
    ["뒤 엉덩이 (H/4+0.5)", back.H], ["뒤 허리 (W/4)", back.W], ["뒤 다트 분량", back.dart],
  ];
  $("calc").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${f(v)}</td></tr>`).join("");
}

[...ids, "showGrain"].forEach(k => $(k).addEventListener("input", render));
render();
</script>
