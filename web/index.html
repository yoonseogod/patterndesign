<title>스레드 드레스 3D 피팅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Homemade+Apple&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D fitting stage on a cutting-mat grid; a pattern-tag control sheet floats right (desktop) / bottom (phone). */
:root {
  --mat: #e6e9e3;        /* cutting mat */
  --mat-line: #d3d8cf;
  --sheet: #f7f8f4;      /* pattern tag paper */
  --ink: #1f2522;
  --muted: #5d665f;
  --thread: #b3361f;     /* red zigzag thread */
  --olive: #5f6431;      /* knit sleeve */
  --line: #c9cfc5;
  --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mat: #191c1a; --mat-line: #242925; --sheet: #202421; --ink: #e4e7e1; --muted: #9aa39b;
    --thread: #e0644a; --olive: #a3a860; --line: #343a35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mat: #191c1a; --mat-line: #242925; --sheet: #202421; --ink: #e4e7e1; --muted: #9aa39b;
  --thread: #e0644a; --olive: #a3a860; --line: #343a35; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--mat); color: var(--ink); font-family: var(--body); overflow: hidden;
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 24px 24px;
}
#app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; touch-action: none; }
.brand {
  position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 2; pointer-events: none;
  display: grid; gap: 2px;
}
.brand h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(22px, 3.2vw, 34px); letter-spacing: .01em; line-height: 1.05; text-wrap: balance; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.size-tag { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }

.sheet {
  position: absolute; z-index: 3; background: var(--sheet); border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0,0,0,.10);
  top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); width: 300px; max-height: calc(100% - 28px);
  overflow: auto; border-radius: 4px; padding: 16px 16px 14px;
  display: grid; gap: 14px;
}
.sheet::before { /* punched tag hole */
  content: ""; position: absolute; top: 10px; left: 50%; width: 10px; height: 10px; margin-left: -5px;
  border-radius: 50%; border: 1px solid var(--line); background: var(--mat);
}
.sec { display: grid; gap: 8px; }
.sec h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
button.pill, label.pill {
  font: 500 13px/1 var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line);
  padding: 8px 11px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button.pill[aria-pressed="true"], label.pill:has(input:checked) { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
button.pill:focus-visible, label.pill:focus-within, input[type=range]:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }
label.pill input { position: absolute; opacity: 0; pointer-events: none; }
.slider { display: grid; gap: 6px; }
.slider .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--thread); }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.chip {
  font: 500 12px/1.2 var(--body); text-align: left; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px dashed var(--line); border-radius: 3px; padding: 7px 8px; display: grid; gap: 2px; min-width: 0;
}
.chip b { font-family: var(--mono); font-weight: 500; font-size: 12px; }
.chip span { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-pressed="true"] { border-style: solid; border-color: var(--thread); color: var(--thread); }
.chip:focus-visible { outline: 2px solid var(--thread); outline-offset: 1px; }
.info { font-size: 12.5px; line-height: 1.55; color: var(--muted); min-height: 3.1em; }
.info strong { color: var(--ink); font-weight: 600; }
.zig { height: 6px; background:
  linear-gradient(135deg, transparent 33%, var(--thread) 33% 45%, transparent 45%) 0 0/8px 6px,
  linear-gradient(45deg, transparent 33%, var(--thread) 33% 45%, transparent 45%) 0 0/8px 6px; opacity: .8; }
.legend { display: grid; gap: 4px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
.legend .bar { height: 8px; border-radius: 2px; background: linear-gradient(90deg, #c0392b, #e6a23c 45%, #f2e6a0 60%, #5aa49b 80%, #3d6fa8); }
.legend .ends { display: flex; justify-content: space-between; }
.tag3d { position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, -50%); font: 500 11px/1.25 var(--mono);
  color: var(--ink); background: var(--sheet); border: 1px solid var(--thread); padding: 3px 6px; border-radius: 3px; white-space: nowrap; }
.tag3d b { color: var(--thread); font-weight: 500; }
.hint { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); pointer-events: none; }
#toggleSheet { display: none; }
#loading[hidden] { display: none; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); z-index: 1; }
@media (max-width: 720px) {
  .sheet { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 46%; gap: 12px; }
  .sheet.collapsed { overflow: hidden; padding-right: 86px; }
  .sheet.collapsed > :not(.sec-view):not(#toggleSheet) { display: none; }
  #toggleSheet { display: inline-flex; position: absolute; right: 12px; top: 12px; }
  .hint { display: none; }
  .chips { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app">
  <div id="stage" aria-label="마네킹에 입힌 드레스 3D 뷰"></div>
  <div id="loading">마네킹에 패턴을 입히는 중…</div>
  <header class="brand">
    <h1>Quilted Thread Dress</h1>
    <p>비대칭 퀼팅 스레드 드레스 · 실제 패턴 조각으로 입힌 3D 피팅</p>
    <span class="size-tag">SIZE 55 · B84 W66 H92 · 165cm</span>
  </header>

  <aside class="sheet" id="sheet">
    <button class="pill" id="toggleSheet" aria-expanded="true">접기</button>
    <div class="sec">
      <h2>재단 → 봉제 → 착용</h2>
      <div class="slider">
        <input type="range" id="sew" min="0" max="1000" value="1000" aria-label="재단에서 착용까지 진행">
        <div class="ends"><span>평면 패턴</span><span id="sewPct">착용 100%</span></div>
      </div>
      <div class="row"><button class="pill" id="play">▶ 입히기 재생</button></div>
    </div>
    <div class="zig" aria-hidden="true"></div>
    <div class="sec sec-view">
      <h2>보기</h2>
      <div class="row" role="group" aria-label="카메라 방향">
        <button class="pill" data-view="front" aria-pressed="true">앞</button>
        <button class="pill" data-view="side" aria-pressed="false">옆</button>
        <button class="pill" data-view="back" aria-pressed="false">뒤</button>
        <button class="pill" data-view="detail" aria-pressed="false">디테일</button>
        <button class="pill" id="spin" aria-pressed="false">자동 회전</button>
      </div>
    </div>
    <div class="sec">
      <h2>레이어</h2>
      <div class="row">
        <label class="pill"><input type="checkbox" id="lyYarn" checked>실 장식</label>
        <label class="pill"><input type="checkbox" id="lyDrape" checked>체크 드레이프</label>
        <label class="pill"><input type="checkbox" id="lyStitch" checked>지그재그 · 아플리케</label>
        <label class="pill"><input type="checkbox" id="lyBody" checked>마네킹</label>
        <label class="pill"><input type="checkbox" id="lyRings">치수 링</label>
        <label class="pill"><input type="checkbox" id="lyHeat">여유분 히트맵</label>
      </div>
      <div class="legend" id="legend" hidden>
        <div class="bar"></div>
        <div class="ends"><span>0cm 밀착</span><span>2.5</span><span>5cm+ 여유</span></div>
      </div>
    </div>
    <div class="sec">
      <h2>패턴 조각</h2>
      <div class="chips" id="chips"></div>
      <div class="info" id="info">조각을 누르거나 3D 옷을 탭하면 해당 패널이 표시됩니다.</div>
    </div>
  </aside>
  <div class="hint">드래그 회전 · 스크롤/핀치 확대 · 우클릭 이동</div>
</div>

  const path = new THREE.CatmullRomCurve3([V(7, 112, 12.2), V(12, 122, 10.6), V(16, 129.5, 7), V(18, 133.2, 0.5), V(17, 130.5, -6.5), V(13.5, 122, -10.2), V(9.5, 112, -11.2)]);
  const NA = 90, NB = 18, pos = [], uv = [], idx = [];
  for (let i = 0; i <= NA; i++) {
    const t = i / NA, c = path.getPointAt(t), T = path.getTangentAt(t);
    const outward = V(c.x - 4, 0, c.z).normalize().add(V(0, 0.6, 0)).normalize();
    const side = new THREE.Vector3().crossVectors(T, outward).normalize();
    const width = lerp(6, 15, Math.sin(Math.PI * t) ** 0.8);
    for (let j = 0; j <= NB; j++) {
      const v = j / NB - 0.5, fold = Math.sin(v * Math.PI * 5 + t * 3) * (0.5 + 0.7 * Math.sin(Math.PI * t));
      const p = c.clone().addScaledVector(side, v * width).addScaledVector(outward, fold + 0.7 + 0.9 * (1 - Math.abs(v) * 2) * Math.sin(Math.PI * t));
      pos.push(p.x, p.y, p.z); uv.push(t * 4, v * 1.6);
    }
  }
  for (let i = 0; i < NA; i++) for (let j = 0; j < NB; j++) { const a = i * (NB + 1) + j, b = a + NB + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  plaidTex.repeat.set(1, 1); plaidTex.rotation = Math.PI / 4;   // bias
  const pm = new THREE.MeshStandardMaterial({ map: plaidTex, roughness: .95, side: THREE.DoubleSide });
  const drape = new THREE.Mesh(g, pm); drape.castShadow = true; drapeGroup.add(drape);
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(3.2, 1.7, 80, 10, 2, 3), pm); knot.position.set(18.6, 128.2, 5.2); knot.scale.setScalar(0.8); knot.rotation.set(0.6, 0.4, 0.2); knot.castShadow = true; drapeGroup.add(knot);
}

/* ======================= INTERACTION ======================= */
const ui = id => document.getElementById(id);
let sewT = 1, playing = false, highlight = null;
const ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
function applySew(t) {
  sewT = t; const e = ease(t);
  for (const m of pieceMeshes) {
    const { flat, worn } = m.userData, pos = m.geometry.attributes.position.array;
    const lift = Math.sin(Math.PI * e) * 26;                // pieces travel on an arc
    for (let i = 0; i < pos.length; i += 3) {
      pos[i] = lerp(flat[i], worn[i], e); pos[i + 1] = lerp(flat[i + 1], worn[i + 1], e) + lift * 0.3; pos[i + 2] = lerp(flat[i + 2], worn[i + 2], e) + lift;
    }
    m.geometry.attributes.position.needsUpdate = true; m.geometry.computeVertexNormals();
  }
  details.visible = t > 0.985;
  ui('sewPct').textContent = t >= 0.999 ? '착용 100%' : t <= 0.001 ? '재단 (평면)' : `봉제 ${Math.round(t * 100)}%`;
  ui('sew').value = Math.round(t * 1000);
}
ui('sew').addEventListener('input', e => { playing = false; applySew(e.target.value / 1000); });
ui('play').addEventListener('click', () => { applySew(0); playing = true; playStart = performance.now(); });
let playStart = 0;
const VIEWS = { front: [0, 112, 420], side: [400, 112, 70], back: [0, 112, -420], detail: [70, 112, 120] };
const TARGETS = { front: [0, 88, 0], side: [0, 88, 0], back: [0, 88, 0], detail: [4, 108, 0] };
let camAnim = null;
function goView(v) {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  camAnim = { from: camera.position.clone(), to: V(...VIEWS[v]), tf: controls.target.clone(), tt: V(...TARGETS[v]), t0: performance.now() };
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
ui('spin').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.2; e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); });
ui('lyYarn').addEventListener('change', e => yarnGroup.visible = e.target.checked);
ui('lyDrape').addEventListener('change', e => drapeGroup.visible = e.target.checked);
ui('lyStitch').addEventListener('change', e => stitchGroup.visible = e.target.checked);
ui('lyBody').addEventListener('change', e => body.visible = e.target.checked);

/* ---------- fit: ease heatmap (garment-to-body gap) ---------- */
const bodyPolar = new Map();
function bodyRadiusAt(h, th) {
  const k = Math.round(h * 2);
  if (!bodyPolar.has(k)) bodyPolar.set(k, rawSection(h, 180).map(([x, z]) => [Math.atan2(x, z), Math.hypot(x, z)]));
  const arr = bodyPolar.get(k); let best = arr[0], bd = 9;
  for (const q of arr) { const d = Math.abs(Math.atan2(Math.sin(q[0] - th), Math.cos(q[0] - th))); if (d < bd) { bd = d; best = q; } }
  return best[1];
}
const armPts = Array.from({ length: 80 }, (_, i) => armCurve.getPointAt(i / 79));
function easeAt(p, frame) {
  if (frame === 'sleeve') {
    let bi = 0, bd = 1e9; armPts.forEach((a, i) => { const d = a.distanceToSquared(p); if (d < bd) { bd = d; bi = i; } });
    return Math.sqrt(bd) - lerp(4.9, 2.9, bi / 79);
  }
  if (p.y < 72) return 6;                       // hangs free below the hips
  return Math.hypot(p.x, p.z) - bodyRadiusAt(p.y, Math.atan2(p.x, p.z));
}
const heatStops = [[0, [192, 57, 43]], [1.2, [230, 162, 60]], [2.5, [242, 230, 160]], [4, [90, 164, 155]], [6, [61, 111, 168]]];
function heatColor(e) {
  e = clamp(e, 0, 6); for (let i = 1; i < heatStops.length; i++) if (e <= heatStops[i][0]) {
    const [a, ca] = heatStops[i - 1], [b, cb] = heatStops[i], t = (e - a) / (b - a); return ca.map((c, j) => lerp(c, cb[j], t) / 255);
  } return heatStops[heatStops.length - 1][1].map(c => c / 255);
}
const heatMats = new Map();
for (const m of pieceMeshes) {
  const w = m.userData.worn, n = w.length / 3, col = new Float32Array(n * 3), v = new THREE.Vector3();
  for (let i = 0; i < n; i++) { v.fromArray(w, i * 3); col.set(heatColor(easeAt(v, m.userData.piece.frame)), i * 3); }
  m.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
  m.userData.fabricMat = m.material;
  heatMats.set(m, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .85, side: THREE.DoubleSide }));
}
ui('lyHeat').addEventListener('change', e => {
  const on = e.target.checked; ui('legend').hidden = !on;
  for (const m of pieceMeshes) m.material = on ? heatMats.get(m) : m.userData.fabricMat;
  select(highlight);
});

/* ---------- measurement rings (finished garment girth vs body girth) ---------- */
const ringGroup = new THREE.Group(); ringGroup.visible = false; scene.add(ringGroup);
const backInv = P.ref.back_y.map(([a, b]) => [b, a]);
const tags = [];
for (const [label, yf] of [['가슴', 26], ['허리', 42], ['엉덩이', 60]]) {
  const h = yToH(yf), sec = garmentSection(h, yf, interp(backInv, yf));
  const pts = []; for (let i = 0; i <= 120; i++) { const [x, z] = sec.at(sec.L * i / 120); const r = Math.hypot(x, z); pts.push(V(x * (1 + .7 / r), h, z * (1 + .7 / r))); }
  const geos = []; for (let i = 0; i < pts.length - 1; i += 2) geos.push(segGeo(pts[i], pts[i + 1], 0.22));
  ringGroup.add(new THREE.Mesh(mergeGeometries(geos), new THREE.MeshBasicMaterial({ color: 0xb3361f })));
  const bodyG = perim(hull(rawSection(h, 192)));
  const el = document.createElement('div'); el.className = 'tag3d'; el.hidden = true;
  el.innerHTML = `${label} <b>${sec.L.toFixed(1)}</b> · 몸 ${bodyG.toFixed(1)}cm`;
  document.getElementById('app').appendChild(el);
  const [x, z] = sec.at(sec.dL); tags.push({ el, pos: V(x + 9, h, z) });
}
ui('lyRings').addEventListener('change', e => { ringGroup.visible = e.target.checked; tags.forEach(t => t.el.hidden = !e.target.checked); });
function placeTags() {
  if (!ringGroup.visible) return;
  const r = renderer.domElement.getBoundingClientRect();
  for (const t of tags) {
    const p = t.pos.clone().project(camera);
    t.el.style.left = `${(p.x + 1) / 2 * r.width}px`; t.el.style.top = `${(1 - p.y) / 2 * r.height}px`;
    t.el.style.visibility = p.z < 1 ? 'visible' : 'hidden';
  }
}
ui('toggleSheet').addEventListener('click', e => { const s = ui('sheet'); const c = s.classList.toggle('collapsed'); s.scrollTop = 0; e.currentTarget.textContent = c ? '펼치기' : '접기'; e.currentTarget.setAttribute('aria-expanded', String(!c)); });

const FABRIC_NAME = { quilt: '아이보리 퀼팅', gauze: '거즈/튤 베이스 + 실 장식', knit: '올리브 울 니트' };
const chips = ui('chips');
for (const m of pieceMeshes) {
  const p = m.userData.piece, b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<b>${p.id}</b><span>${p.name}</span>`; b.addEventListener('click', () => select(highlight === m ? null : m));
  m.userData.chip = b; chips.appendChild(b);
}
function select(m) {
  highlight = m;
  for (const o of pieceMeshes) {
    o.userData.chip.setAttribute('aria-pressed', String(o === m));
    o.material.emissive = new THREE.Color(o === m ? 0x8a1d0c : 0x000000);
    o.material.emissiveIntensity = o === m ? 0.35 : 0;
    o.material.transparent = true; o.material.opacity = m && o !== m ? 0.35 : (o.userData.piece.fabric === 'gauze' ? 0.86 : 1);
  }
  const info = ui('info');
  if (!m) { info.innerHTML = '조각을 누르거나 3D 옷을 탭하면 해당 패널이 표시됩니다.'; return; }
  const p = m.userData.piece;
  const xs = p.outline.map(q => q[0]), ys = p.outline.map(q => q[1]);
  info.innerHTML = `<strong>${p.id} ${p.name}</strong><br>${FABRIC_NAME[p.fabric]} · 완성 치수 약 ${(Math.max(...xs) - Math.min(...xs)).toFixed(1)} × ${(Math.max(...ys) - Math.min(...ys)).toFixed(1)} cm`;
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pieceMeshes, false)[0];
  select(hit ? (highlight === hit.object ? null : hit.object) : null);
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h;
  camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
camera.position.set(...VIEWS.front); controls.target.set(...TARGETS.front); controls.update();
applySew(1);
if (window.innerWidth < 720) ui('toggleSheet').click();   // phones: start with the sheet folded so the whole dress shows
ui('loading').hidden = true;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setAnimationLoop(now => {
  if (playing) {
    const t = clamp((now - playStart) / (reduce ? 1 : 3600), 0, 1); applySew(t); if (t >= 1) playing = false;
  }
  if (camAnim) {
    const t = clamp((now - camAnim.t0) / (reduce ? 1 : 900), 0, 1), e = ease(t);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e); controls.target.lerpVectors(camAnim.tf, camAnim.tt, e);
    if (t >= 1) camAnim = null;
  }
  controls.update(); renderer.render(scene, camera); placeTags();
});
window.__ready = true;
</script>
