<style>
/* Layout: one large 3D folding stage, four candidate tabs with their 15cm crease pattern and folding steps beside it */
:root {
  --bg: #f0f1ec; --paper: #ffffff; --paper-edge: #c8cbc0; --ink: #1d211c; --muted: #646a60;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141613; --paper: #1d201c; --paper-edge: #3a3f37; --ink: #e8eae4; --muted: #9ba196; --mountain: #f0766b; --valley: #77a6f2; --accent: #a9c7a3; --line: #2d312b; --chip: #262a24; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141613; --paper: #1d201c; --paper-edge: #3a3f37; --ink: #e8eae4; --muted: #9ba196; --mountain: #f0766b; --valley: #77a6f2; --accent: #a9c7a3; --line: #2d312b; --chip: #262a24; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-family: var(--display); font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; }
.lead { color: var(--muted); max-width: 66ch; margin: 0 0 18px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tab { font: inherit; font-size: 0.9rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 3px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
.view { position: relative; min-width: 0; }
#three { height: 520px; background: var(--bg); border-radius: 3px; overflow: hidden; touch-action: none; }
@media (max-width: 860px) { #three { height: 380px; } }
#three canvas { display: block; width: 100% !important; height: 100% !important; }
.status { position: absolute; left: 10px; bottom: 10px; font-family: var(--mono); font-size: 0.74rem; color: var(--muted); background: var(--paper); padding: 2px 8px; border-radius: 3px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.meta { font-size: 0.8rem; color: var(--muted); }
.cp { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: var(--paper); }
ol { margin: 0; padding-left: 1.2em; font-size: 0.88rem; display: flex; flex-direction: column; gap: 4px; }
.use { font-size: 0.84rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 0; }
.ctrl { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font-size: 0.85rem; }
.ctrl output { font-family: var(--mono); color: var(--accent); min-width: 4ch; text-align: right; }
.ctrl input { width: 100%; accent-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
button.b { font: inherit; font-size: 0.82rem; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 3px; padding: 3px 10px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 0.78rem; color: var(--muted); margin: 0; }
.key { display: flex; gap: 14px; font-size: 0.8rem; color: var(--muted); }
</style>
<div class="wrap">
  <h1>색종이 모티프 후보</h1>
  <p class="lead">1번 모티프로 쓸 수 있는 더 어려운 패턴 네 가지를 색종이 크기(15 × 15cm)로 만들었어요. 탭을 눌러 3D로 접어 보고 비교해 보세요. 모두 평평하게 접히는 조건 검사와 3D 검증을 통과했어요.</p>
  <div class="tabs" role="tablist" id="tabs"></div>

      <svg class="cp" id="cp" role="img" aria-label="색종이 도면"></svg>
      <div class="key"><span style="color:var(--mountain)">━ 산접기</span><span style="color:var(--valley)">┅ 골접기</span><span>앞면 흰색 · 뒷면 초록</span></div>
      <ol id="steps"></ol>
      <p class="use" id="use"></p>
      <p class="hint" id="note"></p>
    </div>
  </section>
</div>

    f.forEach((p, k) => { tris.push([c, p, f[(k + 1) % f.length]]); edges.push({ i: c, j: p, t: "F" }); });
  }
  const etype = new Map(edges.map(e => [Math.min(e.i, e.j) + "_" + Math.max(e.i, e.j), e.t]));
  const half = new Map(), hinges = [];
  tris.forEach(t => [[0, 1, 2], [1, 2, 0], [2, 0, 1]].forEach(([x, y, z]) => half.set(t[x] + ">" + t[y], t[z])));
  for (const [k, c] of half) {
    const [a, b] = k.split(">").map(Number); if (a > b) continue;
    const d = half.get(b + ">" + a); if (d === undefined) continue;
    const t = etype.get(a + "_" + b) || "F";
    if (t === "M" || t === "V" || t === "F") hinges.push({ a, b, c, d, t, th: 0 });
  }
  return { X, tris, edges, hinges, faces: faces.length };
}

// Position-based solver: edge lengths are hard constraints, every hinge pulls toward its target
// dihedral angle (mountain +, valley −; facets toward flat).
function makeSim(mesh) {
  const N = mesh.X.length, x = new Float64Array(N * 3), xp = new Float64Array(N * 3), f = new Float64Array(N * 3);
  let cx = 0, cy = 0; mesh.X.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= N; cy /= N;
  mesh.X.forEach((p, i) => { x[3 * i] = p[0] - cx; x[3 * i + 1] = p[1] - cy; x[3 * i + 2] = 0; });

  for (let i = 0; i < N; i++) x[3 * i + 2] = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 1e-3;
  xp.set(x);
  const E = mesh.edges.map(e => ({ i: e.i, j: e.j, L: Math.hypot(mesh.X[e.i][0] - mesh.X[e.j][0], mesh.X[e.i][1] - mesh.X[e.j][1]) }));
  const meanL = E.reduce((s, e) => s + e.L, 0) / E.length;
  const H = mesh.hinges.map(h => ({ ...h, L: Math.hypot(mesh.X[h.a][0] - mesh.X[h.b][0], mesh.X[h.a][1] - mesh.X[h.b][1]) / meanL }));
  const sim = { x, N, fold: 0, facetK: 0.3, creaseK: 0.3, err: 0, gain: 0.08, cap: 0.05, damp: 0.85, iters: 12, rate: 0.004 };
  const sub = (i, j) => [x[3 * i] - x[3 * j], x[3 * i + 1] - x[3 * j + 1], x[3 * i + 2] - x[3 * j + 2]];
  const cr = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  const dt = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  sim.reset = () => { mesh.X.forEach((p, i) => { x[3 * i] = p[0] - cx; x[3 * i + 1] = p[1] - cy; x[3 * i + 2] = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 1e-3; }); xp.set(x); H.forEach(h => h.th = 0); sim.fold = 0; };
  sim.step = target => {
    sim.fold += Math.max(-sim.rate, Math.min(sim.rate, target - sim.fold));
    f.fill(0);
    let err = 0, nc = 0;
    for (const h of H) {
      const e = sub(h.b, h.a), el = Math.hypot(...e); if (el < 1e-9) continue;
      const eh = e.map(v => v / el), ca = sub(h.c, h.a), da = sub(h.d, h.a);
      let n1 = cr(e, ca), n2 = cr(e.map(v => -v), sub(h.d, h.b));
      const l1 = Math.hypot(...n1), l2 = Math.hypot(...n2); if (l1 < 1e-12 || l2 < 1e-12) continue;
      n1 = n1.map(v => v / l1); n2 = n2.map(v => v / l2);
      let th = Math.atan2(dt(cr(n1, n2), eh), dt(n1, n2));
      while (th - h.th > Math.PI) th -= 2 * Math.PI; while (th - h.th < -Math.PI) th += 2 * Math.PI;
      h.th = th;
      const goal = h.t === "M" ? Math.PI * sim.fold : h.t === "V" ? -Math.PI * sim.fold : 0;
      if (h.t !== "F") { err += Math.abs(goal - th); nc++; }
      const k = (h.t === "F" ? sim.facetK : sim.creaseK) * h.L * (goal - th);
      const h1 = Math.max(l1 / el, 0.15 * el), h2 = Math.max(l2 / el, 0.15 * el);
      const t1 = dt(ca, e) / (el * el), t2 = dt(da, e) / (el * el);
      const gc = n1.map(v => -v / h1), gd = n2.map(v => -v / h2);
      for (let q = 0; q < 3; q++) {
        f[3 * h.c + q] += k * gc[q]; f[3 * h.d + q] += k * gd[q];
        f[3 * h.a + q] -= k * ((1 - t1) * gc[q] + (1 - t2) * gd[q]);
        f[3 * h.b + q] -= k * (t1 * gc[q] + t2 * gd[q]);
      }
    }
    sim.err = nc ? err / nc : 0;
    const gain = sim.gain * meanL, cap = sim.cap * meanL;
    for (let i = 0; i < 3 * N; i += 3) {
      let dx = f[i] * gain, dy = f[i + 1] * gain, dz = f[i + 2] * gain;
      const m = Math.hypot(dx, dy, dz); if (m > cap) { dx *= cap / m; dy *= cap / m; dz *= cap / m; }
      for (const [o, d] of [[0, dx], [1, dy], [2, dz]]) { const v = (x[i + o] - xp[i + o]) * sim.damp; xp[i + o] = x[i + o]; x[i + o] += v + d; }
    }
    for (let it = 0; it < sim.iters; it++) for (const e of E) {
      const i = 3 * e.i, j = 3 * e.j, dx = x[i] - x[j], dy = x[i + 1] - x[j + 1], dz = x[i + 2] - x[j + 2];
      const d = Math.hypot(dx, dy, dz) || 1e-9, c = 0.5 * (d - e.L) / d;
      x[i] -= c * dx; x[i + 1] -= c * dy; x[i + 2] -= c * dz; x[j] += c * dx; x[j + 1] += c * dy; x[j + 2] += c * dz;
    }
    let mx = 0, my = 0, mz = 0; for (let i = 0; i < 3 * N; i += 3) { mx += x[i]; my += x[i + 1]; mz += x[i + 2]; }
    mx /= N; my /= N; mz /= N;
    for (let i = 0; i < 3 * N; i += 3) { x[i] -= mx; x[i + 1] -= my; x[i + 2] -= mz; xp[i] -= mx; xp[i + 1] -= my; xp[i + 2] -= mz; }
  };
  sim.strain = () => { let s = 0; for (const e of E) { const i = 3 * e.i, j = 3 * e.j; s += Math.abs(Math.hypot(x[i] - x[j], x[i + 1] - x[j + 1], x[i + 2] - x[j + 2]) - e.L) / e.L; } return s / E.length; };
  return sim;
}
// END sim

(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const tabs = $("tabs"), host = $("three"), status = $("status"), fold = $("fold");
  Object.keys(DATA).forEach(k => { const b = document.createElement("button"); b.className = "tab"; b.type = "button"; b.role = "tab"; b.dataset.k = k; b.textContent = INFO[k].name; b.addEventListener("click", () => load(k)); tabs.appendChild(b); });
  function drawCP(k) {
    const d = DATA[k], svg = $("cp"); svg.innerHTML = "";
    svg.setAttribute("viewBox", `-0.3 -0.3 ${d.w + 0.6} ${d.h + 0.6}`);
    const add = (tag, a) => { const e = document.createElementNS(NS, tag); for (const n in a) e.setAttribute(n, a[n]); svg.appendChild(e); };
    add("polygon", { points: d.outline.map(p => p.join(",")).join(" "), fill: "var(--paper)", stroke: "var(--paper-edge)", "stroke-width": 0.08 });
    for (const l of d.lines) add("line", { x1: l.a[0], y1: l.a[1], x2: l.b[0], y2: l.b[1], stroke: l.t === "M" ? "var(--mountain)" : "var(--valley)", "stroke-width": 0.1, "stroke-dasharray": l.t === "V" ? "0.4 0.25" : "none" });
  }
  if (!window.THREE) { status.textContent = "3D 라이브러리를 불러오지 못했어요. 새로고침해 주세요."; Object.keys(DATA).forEach(k => {}); }
  const renderer = window.THREE && new THREE.WebGLRenderer({ antialias: true, alpha: true });
  let scene, camera, controls, mesh, sim, objs = [], triGeo, lineGeo, playing = false, dir = 1, cur, userCam = false, frame = 0;
  if (renderer) {
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); host.appendChild(renderer.domElement);
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000); camera.up.set(0, 0, 1);
    controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.addEventListener("start", () => userCam = true);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 0.75));
    const s1 = new THREE.DirectionalLight(0xffffff, 0.7); s1.position.set(30, -20, 60); scene.add(s1);
    const s2 = new THREE.DirectionalLight(0xffffff, 0.35); s2.position.set(-30, 20, -50); scene.add(s2);
  }
  const front = renderer && new THREE.MeshLambertMaterial({ color: 0xf6f5ef, side: THREE.FrontSide, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const back = renderer && new THREE.MeshLambertMaterial({ color: 0x5f8a62, side: THREE.BackSide, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  function setView(kind) {
    if (!camera) return; userCam = kind !== "auto"; controls.target.set(0, 0, 0);
    const d = 34; if (kind === "top") camera.position.set(0, -0.01, d * 1.3); else camera.position.set(d * 0.35, -d * 0.85, d * 0.8); controls.update();
  }
  function load(k) {
    cur = k; const info = INFO[k];
    tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k ? "true" : "false"));
    $("name").textContent = info.name; $("meta").textContent = info.meta; $("use").textContent = info.use; $("note").textContent = info.note;
    $("steps").innerHTML = info.steps.map(s => `<li>${s}</li>`).join("");
    drawCP(k);
    if (!renderer) return;
    objs.forEach(o => { scene.remove(o); o.geometry.dispose(); }); objs = [];
    mesh = buildMesh(DATA[k]); sim = makeSim(mesh); Object.assign(sim, SIMCFG[k]);
    fold.value = FOLD[k]; $("fold-o").textContent = FOLD[k] + "%"; playing = false; $("play").textContent = "접었다 펴기 반복";
    triGeo = new THREE.BufferGeometry(); triGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(mesh.tris.length * 9), 3));
    const crease = mesh.edges.filter(e => e.t === "M" || e.t === "V");
    lineGeo = new THREE.BufferGeometry(); lineGeo.userData.edges = crease;
    lineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(crease.length * 6), 3));
    const col = new Float32Array(crease.length * 6), cM = new THREE.Color(css("--mountain")), cV = new THREE.Color(css("--valley"));
    crease.forEach((e, n) => { const c = e.t === "M" ? cM : cV; col.set([c.r, c.g, c.b, c.r, c.g, c.b], n * 6); });
    lineGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    objs = [new THREE.Mesh(triGeo, front), new THREE.Mesh(triGeo, back), new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true }))];
    objs.forEach(o => scene.add(o)); setView("auto"); userCam = false; sync();
  }
  function sync() {
    const x = sim.x, P = triGeo.attributes.position.array;
    mesh.tris.forEach((t, n) => t.forEach((v, q) => { P[n * 9 + q * 3] = x[3 * v]; P[n * 9 + q * 3 + 1] = x[3 * v + 1]; P[n * 9 + q * 3 + 2] = x[3 * v + 2]; }));
    triGeo.attributes.position.needsUpdate = true; triGeo.computeVertexNormals(); triGeo.computeBoundingSphere();
    const L = lineGeo.attributes.position.array;
    lineGeo.userData.edges.forEach((e, n) => { for (let q = 0; q < 3; q++) { L[n * 6 + q] = x[3 * e.i + q]; L[n * 6 + 3 + q] = x[3 * e.j + q]; } L[n * 6 + 2] += 0.02; L[n * 6 + 5] += 0.02; });
    lineGeo.attributes.position.needsUpdate = true;
  }
  function size() { if (!renderer) return; const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  function tick() {
    requestAnimationFrame(tick);
    if (!renderer || !sim) return;
    let target = +fold.value / 100;
    if (playing) { target = dir > 0 ? 0.95 : 0; if (Math.abs(sim.fold - target) < 0.002) dir = -dir; }
    const t0 = performance.now(); let n = 0; while (performance.now() - t0 < 12 && n < 40) { sim.step(target); n++; }
    sync();
    if (!userCam && triGeo.boundingSphere) { const want = triGeo.boundingSphere.radius / Math.sin(camera.fov * Math.PI / 360) * 1.1, curD = camera.position.distanceTo(controls.target); camera.position.sub(controls.target).multiplyScalar(1 + (want / curD - 1) * 0.06).add(controls.target); }
    if (++frame % 15 === 0) status.textContent = `접힘 ${Math.round(sim.fold * 100)}% · 각도 오차 ${(sim.err * 180 / Math.PI).toFixed(1)}° · 늘어남 ${(sim.strain() * 100).toFixed(2)}%`;
    controls.update(); renderer.render(scene, camera);
  }
  fold.addEventListener("input", () => { $("fold-o").textContent = fold.value + "%"; playing = false; $("play").textContent = "접었다 펴기 반복"; });
  $("play").addEventListener("click", e => { playing = !playing; dir = 1; e.target.textContent = playing ? "멈추기" : "접었다 펴기 반복"; });
  $("reset").addEventListener("click", () => sim && sim.reset());
  $("top").addEventListener("click", () => setView("top")); $("angle").addEventListener("click", () => setView("angle"));
  if (renderer) { new ResizeObserver(size).observe(host); size(); }
  window.__m = { load, state: () => sim };
  load("gmiura"); tick();
})();
</script>
