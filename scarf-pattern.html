<title>머플러 재단 패턴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same drafting table as the skirt page — controls column beside a gridded pattern sheet; stacks on phones */
:root {
  --bg: #eef1f3;
  --sheet: #fbfcfd;
  --grid: #d9e2ea;
  --grid-major: #b7c6d4;
  --ink: #1c2b3a;
  --muted: #5d6e7f;
  --piece: #ffffff;
  --sa: #dbe7f2;
  --fold: #c2412d;
  --accent: #2e5f8a;
  --line: #cbd5de;
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121820; --sheet: #18212b; --grid: #223040; --grid-major: #31455a; --ink: #e3ebf2; --muted: #93a5b6;
  --piece: #1f2b38; --sa: #2a3d52; --fold: #ef7a63; --accent: #7fb2de; --line: #2c3a48; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121820; --sheet: #18212b; --grid: #223040; --grid-major: #31455a; --ink: #e3ebf2; --muted: #93a5b6;
  --piece: #1f2b38; --sa: #2a3d52; --fold: #ef7a63; --accent: #7fb2de; --line: #2c3a48; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
h1 { font-family: var(--display); font-size: 1.9rem; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.field label { font-size: 0.92rem; }
.field output { font-family: var(--mono); font-size: 0.88rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg label { display: block; text-align: center; padding: 7px 4px; font-size: 0.85rem; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--accent); font-weight: 700; }
.seg label:has(input:checked) { background: var(--sa); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
td:last-child { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; min-width: 0; }
.sheet svg { display: block; width: 100%; height: auto; min-width: 620px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--muted); padding: 10px 14px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.steps { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; margin-top: 20px; }
.steps h2 { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.steps ol { margin: 0; padding-left: 1.3em; max-width: 70ch; }
.steps li { margin: 4px 0; }
.note { font-size: 0.8rem; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>머플러 재단 패턴</h1>
    <p class="sub">직사각형 한 장이면 되는 가장 간단한 머플러예요. 치수와 만드는 방식을 고르면 재단 크기와 필요한 원단이 바로 계산돼요.</p>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2>완성 치수 (cm)</h2>
      <div class="field"><label for="width">폭</label><output id="o-width"></output><input type="range" id="width" min="15" max="70" step="1" value="25"></div>
      <div class="field"><label for="length">길이</label><output id="o-length"></output><input type="range" id="length" min="100" max="220" step="5" value="160"></div>
      <h2>만드는 방식</h2>
      <div class="seg" role="radiogroup" aria-label="만드는 방식">
        <label><input type="radio" name="build" value="tube" checked><span>두 겹 (통박기)</span></label>
        <label><input type="radio" name="build" value="single"><span>홑겹 (말아박기)</span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="양 끝 모양">
        <label><input type="radio" name="end" value="flat" checked><span>일자 끝</span></label>
        <label><input type="radio" name="end" value="point"><span>뾰족 끝</span></label>
      </div>
      <div class="field"><label for="sa">시접</label><output id="o-sa"></output><input type="range" id="sa" min="0.5" max="2" step="0.5" value="1"></div>
      <label class="check"><input type="checkbox" id="showGrain" checked> 식서 방향 표시</label>
      <h2>계산값</h2>
      <table id="calc"></table>
      <p class="note">원단은 110cm 폭 기준으로 계산했어요. 플리스·울처럼 올이 안 풀리는 원단은 홑겹에 시접 없이 잘라도 돼요.</p>
    </aside>

    <section class="sheet">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="머플러 재단 패턴"></svg>
      <div class="legend">
        <span><i class="sw" style="background:var(--piece);border:1.5px solid var(--ink)"></i>완성선</span>
        <span><i class="sw" style="background:var(--sa)"></i>시접</span>
        <span><i class="sw" style="background:var(--fold)"></i>접는 선 · 창구멍</span>
        <span>격자 1칸 = 1cm</span>
      </div>
    </section>
  </div>

  <section class="steps">
    <h2>만드는 순서</h2>
    <ol id="steps"></ol>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const ids = ["width", "length", "sa"];
const f = n => (Math.round(n * 10) / 10).toFixed(1);
const radio = name => document.querySelector(`input[name=${name}]:checked`).value;
const FABRIC_W = 110;

function render() {
  const o = Object.fromEntries(ids.map(k => [k, parseFloat($(k).value)]));
  ids.forEach(k => $("o-" + k).textContent = f(o[k]) + " cm");
  const tube = radio("build") === "tube";
  const point = radio("end") === "point";

  // Finished piece in cm, laid along x. Tube: cut double width, fold along the long middle line.
  const L = o.length;
  const H = tube ? o.width * 2 : o.width;       // finished-line height of the cut piece
  const tip = point ? o.width * 0.6 : 0;         // how far the point sticks out past the rectangle
  const sa = tube ? o.sa : o.sa * 2;             // single layer uses a narrow double-turned hem
  const body = L - tip * 2;
  const outline = point
    ? `M${tip} 0 H${tip + body} L${L} ${H / 2} L${tip + body} ${H} H${tip} L0 ${H / 2} Z`
    : `M0 0 H${L} V${H} H0 Z`;
  // For a pointed tube, each end is a chevron so the folded scarf comes to a single point.
  const tubePoint = tube && point
    ? `M${tip} 0 H${tip + body} L${L} ${H / 4} L${tip + body} ${H / 2} L${L} ${H * 3 / 4} L${tip + body} ${H} H${tip} L0 ${H * 3 / 4} L${tip} ${H / 2} L0 ${H / 4} Z`
    : null;
  const path = tubePoint || outline;

  const cutL = L + sa * 2, cutH = H + sa * 2;
  const m = 6;
  const vw = cutL + m * 2 + 6, top = -m - sa - 2, vh = cutH + m * 2 + 10;
  const ox = m + sa;

  const showGrain = $("showGrain").checked;
  const gy = tube ? H / 4 : H / 2;
  const gapX = L * 0.62, gapW = Math.min(15, L * 0.1);

  $("svg").setAttribute("viewBox", `0 ${top} ${vw} ${vh}`);
  $("svg").innerHTML = `
    <defs>
      <pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="var(--grid)" stroke-width="0.05"/></pattern>
      <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#g1)"/><path d="M5 0H0V5" fill="none" stroke="var(--grid-major)" stroke-width="0.08"/></pattern>
    </defs>
    <style>.sm{font:2.4px var(--body);fill:var(--muted)}.lg{font:700 4.2px var(--body);fill:var(--ink)}.dim{font:2.4px var(--mono);fill:var(--accent)}.fl{font:2.4px var(--body);fill:var(--fold)}</style>
    <rect x="0" y="${top}" width="${vw}" height="${vh}" fill="var(--sheet)"/>
    <rect x="0" y="${top}" width="${vw}" height="${vh}" fill="url(#g5)"/>
    <g transform="translate(${ox} 0)">
      <path d="${path}" fill="var(--sa)" stroke="var(--sa)" stroke-width="${sa * 2}" stroke-linejoin="${point ? "miter" : "round"}"/>
      <path d="${path}" fill="var(--piece)" stroke="var(--ink)" stroke-width="0.25" stroke-linejoin="miter"/>
      ${tube ? `
        <line x1="${point ? tip : 0}" y1="${H / 2}" x2="${point ? tip + body : L}" y2="${H / 2}" stroke="var(--fold)" stroke-width="0.3" stroke-dasharray="2 0.8 0.4 0.8"/>
        <text x="${L / 2}" y="${H / 2 - 1.2}" text-anchor="middle" class="fl">골선 (반으로 접는 선)</text>
        <line x1="${gapX}" y1="${H + sa + 0.6}" x2="${gapX + gapW}" y2="${H + sa + 0.6}" stroke="var(--fold)" stroke-width="0.5"/>
        <text x="${gapX + gapW / 2}" y="${H + sa + 3.6}" text-anchor="middle" class="fl">창구멍 ${f(gapW)}</text>` : ""}
      ${showGrain ? `<g stroke="var(--accent)" stroke-width="0.2" fill="var(--accent)">
        <line x1="${L * 0.2}" y1="${gy}" x2="${L * 0.45}" y2="${gy}"/>
        <path d="M${L * 0.2 - 1} ${gy} l2 -0.8 v1.6 z M${L * 0.45 + 1} ${gy} l-2 -0.8 v1.6 z" stroke="none"/></g>` : ""}
      <text x="${L * 0.2}" y="${gy + 5.5}" class="lg">머플러</text>
      <text x="${L * 0.2}" y="${gy + 9}" class="sm">1장 · ${tube ? "두 겹 통박기" : "홑겹 말아박기"}</text>
    </g>
    <g>
      <line x1="${ox}" y1="${H + sa + 6}" x2="${ox + L}" y2="${H + sa + 6}" stroke="var(--accent)" stroke-width="0.12"/>
      <path d="M${ox} ${H + sa + 5.3} v1.4 M${ox + L} ${H + sa + 5.3} v1.4" stroke="var(--accent)" stroke-width="0.12"/>
      <text x="${ox + L / 2}" y="${H + sa + 9.5}" text-anchor="middle" class="dim">완성 길이 ${f(L)}</text>
      <line x1="${ox + L + sa + 2}" y1="0" x2="${ox + L + sa + 2}" y2="${H}" stroke="var(--accent)" stroke-width="0.12"/>
      <path d="M${ox + L + sa + 1.3} 0 h1.4 M${ox + L + sa + 1.3} ${H} h1.4" stroke="var(--accent)" stroke-width="0.12"/>
      <text x="${ox + L + sa + 4.6}" y="${H / 2}" class="dim" text-anchor="middle" transform="rotate(90 ${ox + L + sa + 4.6} ${H / 2})">완성선 폭 ${f(H)}</text>
    </g>`;

  // Fabric needed: lay the long side along the selvage if it fits, else across the 110cm width.
  const need = cutH <= FABRIC_W ? cutL : null;
  const rows = [
    ["재단 길이 (시접 포함)", f(cutL) + " cm"],
    ["재단 폭 (시접 포함)", f(cutH) + " cm"],
    ["완성 폭", f(o.width) + " cm"],
    ["필요 원단 (110cm 폭)", need ? f(Math.ceil(need / 10) * 10) + " cm" : "폭 초과"],
  ];
  $("calc").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");

  const steps = tube ? [
    `원단을 식서 방향으로 ${f(cutL)} × ${f(cutH)}cm 한 장 재단해요.`,
    "겉끼리 마주 보게 골선을 따라 길게 반으로 접어요.",
    `가장자리를 ${f(o.sa)}cm 시접으로 둘러 박되, 긴 쪽에 창구멍 ${f(gapW)}cm를 남겨요.`,
    point ? "뾰족한 끝은 모서리 시접을 바느질선 2mm 앞까지 비스듬히 잘라내요." : "네 모서리 시접을 사선으로 잘라 부피를 줄여요.",
    "창구멍으로 뒤집어 모서리를 송곳으로 빼내고 다림질해요.",
    "창구멍을 공그르기로 막고, 원하면 가장자리를 0.5cm 상침해요.",
  ] : [
    `원단을 식서 방향으로 ${f(cutL)} × ${f(cutH)}cm 한 장 재단해요.`,
    `네 변을 ${f(o.sa)}cm씩 두 번 접어 다려요 (총 ${f(sa)}cm 시접).`,
    point ? "뾰족한 끝은 꼭짓점 시접을 액자 모서리처럼 접어 겹침을 줄여요." : "모서리는 대각선으로 한 번 접은 뒤 두 변을 접어 액자 모서리로 정리해요.",
    "접은 선 안쪽 끝을 따라 둘러 박아요.",
    "다림질로 마무리해요.",
  ];
  $("steps").innerHTML = steps.map(s => `<li>${s}</li>`).join("");
}

[...ids, "showGrain"].forEach(k => $(k).addEventListener("input", render));
document.querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", render));
render();
</script>
